<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Decorative Modern Blobs -->
  <circle cx="1100" cy="100" r="280" fill="#0ea5e9" opacity="0.15" />
  <circle cx="100" cy="550" r="220" fill="#f97316" opacity="0.12" />
  <circle cx="850" cy="500" r="320" fill="#38bdf8" opacity="0.1" />

  <!-- Left Content Area -->
  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="90" height="90" rx="22" fill="#0284c7" />
    <text x="45" y="62" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>
  </g>

  <!-- Title / Brand -->
  <text x="215" y="158" font-family="'Inter', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="1">Kajefly</text>
  <text x="420" y="158" font-family="'Hind Siliguri', sans-serif" font-size="32" font-weight="600" fill="#38bdf8">(কাজেফ্লাই)</text>

  <!-- Main Headline in Bangla -->
  <text x="100" y="270" font-family="'Hind Siliguri', sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    ছোট ব্র্যান্ড, <tspan fill="url(#accentGrad)">বড় উড়ান! 🚀</tspan>
  </text>

  <!-- Subheadline -->
  <text x="100" y="335" font-family="'Hind Siliguri', sans-serif" font-size="26" font-weight="400" fill="#bae6fd">
    F-Commerce ও লোকাল বিজনেসের সম্পূর্ণ সোশ্যাল মিডিয়া গ্রোথ পার্টনার
  </text>

  <!-- Bullet Points / Pills -->
  <g transform="translate(100, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="26" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <text x="110" y="34" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">✨ কন্টেন্ট অটোমেশন</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="200" height="52" rx="26" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <text x="340" y="34" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">🎨 ব্র্যান্ডিং ও রিলস</text>

    <!-- Pill 3 -->
    <rect x="460" y="0" width="230" height="52" rx="26" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <text x="575" y="34" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">🌐 ওয়েবসাইট সল্যুশন</text>
  </g>

  <!-- Footer Info / CTA -->
  <line x1="100" y1="490" x2="1100" y2="490" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <text x="100" y="550" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#f8fafc">
    🌐 shouravsingha.github.io/kajefly
  </text>
  <text x="800" y="550" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)">
    📩 ফ্রি অডিটের জন্য ইনবক্স করুন
  </text>
</svg>
