<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0614" />
      <stop offset="50%" stop-color="#140c26" />
      <stop offset="100%" stop-color="#100820" />
    </linearGradient>

    <linearGradient id="chartreuseText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6ff00" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <linearGradient id="tomatoText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff775e" />
      <stop offset="100%" stop-color="#ea3219" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bgBanner)" />

  <!-- Luminous Orbs -->
  <circle cx="1080" cy="120" r="280" fill="#b6ff00" opacity="0.08" />
  <circle cx="120" cy="540" r="240" fill="#ea3219" opacity="0.08" />
  <circle cx="600" cy="300" r="380" fill="#7337d4" opacity="0.06" />

  <!-- Structural Grid Lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="rgba(203, 175, 245, 0.12)" stroke-width="1" />
  <line x1="80" y1="550" x2="1120" y2="550" stroke="rgba(203, 175, 245, 0.12)" stroke-width="1" />

  <!-- Brand Mark -->
  <g transform="translate(100, 130)">
    <rect width="84" height="84" rx="20" fill="#130c24" stroke="rgba(203, 175, 245, 0.25)" stroke-width="2" />
    <text x="42" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#b6ff00" text-anchor="middle">K</text>
  </g>

  <!-- Brand Typography -->
  <text x="210" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#f0eafc" letter-spacing="-0.5">Kajefly</text>
  <text x="405" y="182" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#b6ff00" letter-spacing="2">/ AUTONOMOUS GROWTH</text>

  <!-- Badge Pill -->
  <rect x="100" y="240" width="310" height="34" rx="17" fill="rgba(182, 255, 0, 0.1)" stroke="#b6ff00" stroke-width="1" />
  <text x="255" y="262" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b6ff00" text-anchor="middle" letter-spacing="1.5">HIGH-CONVERTING SOCIAL COMMERCE</text>

  <!-- Headline in Pure English -->
  <text x="100" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="800" fill="#ffffff">
    We Engineer <tspan fill="url(#chartreuseText)">Hyper-Growth</tspan> Pipelines.
  </text>

  <!-- Subtitle -->
  <text x="100" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#cbaff5">
    Viral Algorithmic Content • 1-Click Storefronts • Predictable Meta Acquisition
  </text>

  <!-- Footer Link & CTA -->
  <text x="100" y="520" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#cbaff5">
    🌐 shouravsingha.github.io/kajefly
  </text>
  <text x="820" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="url(#tomatoText)">
    Claim Free 24h Brand Audit →
  </text>
</svg>
