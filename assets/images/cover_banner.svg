<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="covBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="45%" stop-color="#120926" />
      <stop offset="100%" stop-color="#0d051c" />
    </linearGradient>

    <!-- Kinetic Chartreuse Gradient -->
    <linearGradient id="covChartreuse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#b6ff00" />
    </linearGradient>

    <!-- Tomato Red Gradient -->
    <linearGradient id="covTomato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a63" />
      <stop offset="100%" stop-color="#ea3219" />
    </linearGradient>

    <linearGradient id="covLavText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8c5f8" />
    </linearGradient>

    <!-- Ambient Bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#b6ff00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Slate Canvas -->
  <rect width="1200" height="630" fill="url(#covBg)" />

  <!-- Background Architecture Lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="rgba(203, 175, 245, 0.12)" stroke-width="1.5" />
  <line x1="80" y1="550" x2="1120" y2="550" stroke="rgba(203, 175, 245, 0.12)" stroke-width="1.5" />
  <circle cx="1060" cy="140" r="260" fill="#b6ff00" opacity="0.06" filter="url(#bloom)" />
  <circle cx="140" cy="520" r="240" fill="#ea3219" opacity="0.07" />

  <!-- ================= LEFT: LOGO EMBLEM ================= -->
  <g transform="translate(100, 120)">
    <!-- Rounded Emblem Container -->
    <rect width="96" height="96" rx="26" fill="#180e2f" stroke="rgba(203, 175, 245, 0.3)" stroke-width="2" />
    
    <!-- Miniature Embedded Soaring K Mark -->
    <g transform="translate(16, 14) scale(0.68)">
      <!-- Pillar -->
      <rect x="15" y="5" width="13" height="78" rx="6.5" fill="#f0eafc" />
      <!-- Upper Wing -->
      <path d="M 28 42 L 65 5 C 68 2, 73 3, 75 7 C 78 11, 77 16, 73 19 L 42 48 Z" fill="url(#covChartreuse)" />
      <!-- Lower Vector -->
      <path d="M 38 43 L 73 80 C 76 83, 76 88, 73 91 C 70 94, 65 94, 62 91 L 28 54 Z" fill="url(#covTomato)" />
      <!-- Core -->
      <circle cx="34" cy="46" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="220" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="url(#covLavText)" letter-spacing="-0.5">Kajefly</text>
  <text x="420" y="180" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#b6ff00" letter-spacing="2">/ AUTONOMOUS COMMERCE</text>

  <!-- Telemetry Badge -->
  <rect x="100" y="240" width="360" height="36" rx="18" fill="rgba(182, 255, 0, 0.08)" stroke="#b6ff00" stroke-width="1.2" />
  <circle cx="120" cy="258" r="4" fill="#b6ff00" />
  <text x="135" y="263" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b6ff00" letter-spacing="1.5">OFFICIAL BRAND IDENTITY &amp; MEDIA</text>

  <!-- Main Headline in Pure English -->
  <text x="100" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    Engineering <tspan fill="url(#covChartreuse)">Hyper-Growth</tspan> for Modern Brands.
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#cbaff5">
    Algorithmic Social Systems • 1-Click Mobile Storefronts • Predictable Meta ROAS
  </text>

  <!-- Footer Link & CTA -->
  <text x="100" y="520" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#cbaff5">
    🌐 shouravsingha.github.io/kajefly
  </text>
  <text x="780" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="url(#covTomato)">
    Claim Complimentary Brand Audit →
  </text>
</svg>
