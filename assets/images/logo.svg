<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle / Rounded Square -->
  <rect width="500" height="500" rx="110" fill="#0c4a6e" />
  
  <!-- Stylized Wing / Flight icon behind K -->
  <path d="M 160 360 C 220 340, 360 260, 410 120 C 330 180, 240 240, 160 360 Z" fill="url(#brandGrad)" opacity="0.85" filter="url(#shadow)" />
  
  <!-- Modern K Lettermark -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="140" y="120" width="45" height="260" rx="22.5" />
    <!-- Diagonal Up Wing -->
    <path d="M 185 245 L 290 135 C 298 127 312 127 320 135 C 328 143 328 157 320 165 L 225 265 Z" />
    <!-- Diagonal Down Arrow -->
    <path d="M 215 250 L 325 365 C 333 373 333 387 325 395 C 317 403 303 403 295 395 L 185 280 Z" />
  </g>

  <!-- Sparkle Accent -->
  <circle cx="395" cy="115" r="16" fill="#fbbf24" />
</svg>
