<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Twilight Canvas -->
    <radialGradient id="logoBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1b1035" />
      <stop offset="60%" stop-color="#0f0721" />
      <stop offset="100%" stop-color="#070310" />
    </radialGradient>

    <!-- Kinetic Chartreuse Gradient (Ascending Wing) -->
    <linearGradient id="chartreuseWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#b6ff00" />
      <stop offset="100%" stop-color="#d9ff66" />
    </linearGradient>

    <!-- Precision Tomato Red Gradient (Conversion Chevron) -->
    <linearGradient id="tomatoChevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a63" />
      <stop offset="60%" stop-color="#ff452b" />
      <stop offset="100%" stop-color="#cc250f" />
    </linearGradient>

    <!-- Royal Lavender Metallic (Pillar of Trust) -->
    <linearGradient id="lavenderPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2d4f8" />
      <stop offset="100%" stop-color="#ad8fe6" />
    </linearGradient>

    <!-- Soft Ambient Bloom Glow -->
    <filter id="electricBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#b6ff00" flood-opacity="0.45"/>
    </filter>
    <filter id="tomatoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#ff452b" flood-opacity="0.45"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Rounded Hexa-Tile with fine metallic rim -->
  <rect x="15" y="15" width="470" height="470" rx="115" fill="url(#logoBg)" stroke="rgba(203, 175, 245, 0.22)" stroke-width="2.5" filter="url(#tileShadow)" />

  <!-- Subtle Concentric Orbit Rings (Signifying System Stability & Precision) -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(173, 130, 238, 0.06)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="rgba(182, 255, 0, 0.05)" stroke-width="1.5" />

  <!-- ================= LOGOMARK: THE SOARING "K" ARCHITECTURE ================= -->
  <!-- 
       Concept Meaning:
       1. The Left Pillar: Grounded foundation, discipline & execution ("Kaje" / Work).
       2. The Upper Wing: Ascending aerodynamic flight in Chartreuse ("Fly" / Scale).
       3. The Lower Arrow: Dynamic propulsion & high-conversion velocity in Tomato Red.
  -->

  <g transform="translate(10, 0)">
    <!-- 1. Foundation Pillar (Lavender Titanium) -->
    <path d="M 140 120 C 140 106, 151 95, 165 95 C 179 95, 190 106, 190 120 L 190 380 C 190 394, 179 405, 165 405 C 151 405, 140 394, 140 380 Z" 
          fill="url(#lavenderPillarGrad)" />

    <!-- 2. The Soaring Ascending Wing (Electric Chartreuse) -->
    <!-- Starts from center spine and launches upward into an eagle's aerodynamic wing -->
    <path d="M 198 245 L 308 126 C 318 115, 336 116, 345 127 C 354 138, 353 155, 341 166 L 246 268 Z" 
          fill="url(#chartreuseWingGrad)" 
          filter="url(#electricBloom)" />

    <!-- Extended Aerial Feather Accent -->
    <path d="M 325 110 C 375 140, 415 190, 425 240 C 390 200, 340 170, 290 155 Z" 
          fill="url(#chartreuseWingGrad)" 
          opacity="0.9"
          filter="url(#electricBloom)" />

    <!-- 3. The Propulsion Chevron (Tomato Red) -->
    <!-- Anchors bottom diagonal with forward kinetic force -->
    <path d="M 235 252 L 350 376 C 360 387, 359 404, 348 414 C 337 424, 320 423, 310 412 L 198 290 Z" 
          fill="url(#tomatoChevronGrad)" 
          filter="url(#tomatoBloom)" />

    <!-- Core Fusion Jewel (Where Work Meets Flight) -->
    <circle cx="220" cy="265" r="9" fill="#ffffff" />
  </g>

  <!-- Northern Star Telemetry Sparkle -->
  <polygon points="425,95 430,110 445,115 430,120 425,135 420,120 405,115 420,110" fill="#b6ff00" filter="url(#electricBloom)" />
</svg>
