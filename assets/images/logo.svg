<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Luxury Lavender Ink Gradient -->
    <linearGradient id="inkLav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e2f" />
      <stop offset="50%" stop-color="#100822" />
      <stop offset="100%" stop-color="#080412" />
    </linearGradient>

    <!-- Chartreuse Electric Glow -->
    <linearGradient id="chartreuseWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6ff00" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Tomato Red Vector -->
    <linearGradient id="tomatoRocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff775e" />
      <stop offset="100%" stop-color="#ea3219" />
    </linearGradient>

    <filter id="cBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#b6ff00" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Slate Tile -->
  <rect width="500" height="500" rx="110" fill="url(#inkLav)" stroke="rgba(203, 175, 245, 0.2)" stroke-width="2.5" />

  <!-- Dynamic Flying Wing in Chartreuse -->
  <path d="M 140 375 C 220 340, 370 260, 420 110 C 330 180, 230 250, 140 375 Z" fill="url(#chartreuseWing)" filter="url(#cBloom)" />

  <!-- Monogram K Structure -->
  <g>
    <!-- Lavender Main Column -->
    <rect x="135" y="125" width="46" height="250" rx="23" fill="#f0eafc" />
    <!-- Upper Diagonal Wing in Lavender -->
    <path d="M 180 245 L 295 130 C 304 121 318 121 327 130 C 336 139 336 153 327 162 L 225 265 Z" fill="#e1d5f9" />
    <!-- Lower Diagonal Launch Vector in Tomato Red -->
    <path d="M 215 250 L 330 365 C 339 374 339 388 330 397 C 321 406 307 406 298 397 L 180 280 Z" fill="url(#tomatoRocket)" />
  </g>

  <!-- Modern Telemetry Indicator -->
  <circle cx="415" cy="110" r="14" fill="#b6ff00" filter="url(#cBloom)" />
</svg>
